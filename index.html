<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrewGenge</title><style>
:root{--g:#bd5b08;--d:#1d1917;--bg:#f7f5f1;--line:#e6dfd8}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:var(--bg);color:#211d1a}.shell{display:flex;min-height:100vh}aside{width:240px;background:var(--d);color:#eee;padding:18px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:10px;align-items:center;color:#f5b43f;font:bold 22px Georgia}.brand svg{width:42px;height:42px}nav{margin-top:25px}nav button{width:100%;text-align:left;padding:11px;border:0;border-radius:8px;background:none;color:#ddd;font-weight:bold}nav button.on,nav button:hover{background:var(--g);color:white}.body{margin-left:240px;flex:1}header{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}header h1{font:700 24px Georgia;flex:1}main{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #0000000b}.tools{display:flex;gap:9px;flex-wrap:wrap}.tools input{flex:1;min-width:220px}.btn,input,select{padding:9px 12px;border-radius:8px;border:1px solid var(--line)}.btn{background:var(--g);color:white;font-weight:bold;cursor:pointer}.btn.alt{background:white;color:#211d1a}.btn.red{background:white;color:#b42318}.list{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}th{font-size:11px;color:#6f6963}.thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;background:#74340f}.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}.name{font-weight:bold}.muted{font-size:12px;color:#6f6963}.star{border:0;background:none;font-size:20px;color:#bbb}.star.on{color:var(--g)}.actions{display:flex;gap:4px}.actions button{background:white;border:1px solid var(--line);border-radius:6px;height:30px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(520px,95vw);background:white;border-radius:14px;padding:24px}.preview{width:100px;height:100px;margin:auto;border-radius:12px;overflow:hidden}.preview img,.preview svg{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid var(--line);border-radius:10px;padding:15px}.note{background:#fff1dc;padding:12px;border-radius:8px} @media(max-width:800px){aside{display:none}.body{margin:0}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><div class="brand" id="brand"></div><nav id="nav"></nav></aside><div class="body"><header><h1 id="title"></h1><span id="status">Local</span></header><main id="app"></main></div></div><script>
const logo=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#1d1917" stroke="#f5b43f" stroke-width="4"/><path d="M50 9c-12 9-12 16 0 22 12-6 12-13 0-22M10 50c9-12 16-12 22 0-6 12-13 12-22 0M90 50c-9-12-16-12-22 0 6 12 13 12 22 0M50 91c-12-9-12-16 0-22 12 6 12 13 0 22" fill="none" stroke="#f5b43f" stroke-width="3"/><path d="M50 25c-15 8-18 28-8 42 5 7 11 7 16 0 10-14 7-34-8-42Z" fill="#bd5b08"/><path d="M50 20l6 12H44Z" fill="#f5b43f"/></svg>`;
const ico=(c)=>`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="12" fill="${c}"/><circle cx="50" cy="30" r="15" fill="#f5b43f"/><path d="M12 70Q50 22 88 70M12 70h76M28 70V50M50 70V35M72 70V50" fill="none" stroke="#211d1a" stroke-width="5"/></svg>`;
const seed=[['HenHouse Incredible IPA Clone','West Coast IPA',6.9,58,'#74340f'],['Newy XPA','Australian XPA',4.8,28,'#078dcc'],['Hunter Valley Hazy IPA','NEIPA',6.5,35,'#c65313'],['American Red IPA','Red IPA',7,65,'#a11b1b'],['Aussie Classic Lager','Lager',4.6,18,'#dbaa16'],['Dry Irish Stout','Stout',4.4,38,'#172138'],['Belgian Wit','Witbier',5,15,'#66bfe7'],['Hunter Hazy DIPA','DIPA',8,45,'#6d28d9'],['Session Pale Ale','Pale Ale',3.8,25,'#159a65'],['Oatmeal Stout','Stout',5.4,32,'#403b37']].map((x,i)=>({id:'r'+(i+1),name:x[0],style:x[1],abv:x[2],ibu:x[3],color:x[4],batch:40,desc:'BrewGenge recipe library',custom:false,image:null}));let S;try{S=JSON.parse(localStorage.getItem('brewgenge_pack'))||{recipes:seed,favs:[]}}catch{S={recipes:seed,favs:[]}};let page='Recipe Library';const save=()=>localStorage.setItem('brewgenge_pack',JSON.stringify(S));const img=r=>r.image?`<img src="${r.image}">`:ico(r.color);document.querySelector('#brand').innerHTML=logo+'<span>BrewGenge</span>';
function render(){let pages=['Recipe Library','Create a Brew','Read Me'];document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'on':''}" data-p="${p}">${p}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});document.querySelector('#title').textContent=page;(page==='Recipe Library'?library:page==='Create a Brew'?create:readme)()}
function library(){document.querySelector('#app').innerHTML=`<div class="card tools"><input id="q" placeholder="Search recipes"><label><input type="checkbox" id="ff" checked> Favourites first</label><button class="btn" id="new">+ New Brew</button><button class="btn alt" id="pack">Export Recipe Pack</button><button class="btn alt" id="import">Import JSON</button><input type="file" id="file" accept=".json" hidden></div><div class="card list"><table><thead><tr><th></th><th></th><th>Recipe</th><th>Style</th><th>ABV</th><th>IBU</th><th>Source</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;let favFirst=true;const rows=()=>{let q=document.querySelector('#q').value.toLowerCase(),a=S.recipes.filter(r=>(r.name+r.style).toLowerCase().includes(q));if(favFirst)a.sort((x,y)=>S.favs.includes(y.id)-S.favs.includes(x.id));document.querySelector('#rows').innerHTML=a.map(r=>`<tr><td><button class="star ${S.favs.includes(r.id)?'on':''}" data-f="${r.id}">${S.favs.includes(r.id)?'★':'☆'}</button></td><td><div class="thumb">${img(r)}</div></td><td><div class="name">${r.name}</div><div class="muted">${r.desc}</div></td><td>${r.style}</td><td>${r.abv}%</td><td>${r.ibu}</td><td>${r.custom?'BrewGenge':'Library'}</td><td><div class="actions"><button data-e="${r.id}">✎</button><button data-d="${r.id}">🗑</button></div></td></tr>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.favs.includes(b.dataset.f)?S.favs=S.favs.filter(x=>x!==b.dataset.f):S.favs.push(b.dataset.f);save();rows()});document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(S.recipes.find(r=>r.id===b.dataset.e),rows));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete brew?')){S.recipes=S.recipes.filter(r=>r.id!==b.dataset.d);save();rows()}})};rows();document.querySelector('#q').oninput=rows;document.querySelector('#ff').onchange=e=>{favFirst=e.target.checked;rows()};document.querySelector('#new').onclick=()=>{page='Create a Brew';render()};document.querySelector('#pack').onclick=pack;document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=imp}
function resize(f,cb){let rd=new FileReader;rd.onload=()=>{let im=new Image;im.onload=()=>{let m=500,w=im.width,h=im.height;if(w>h&&w>m){h*=m/w;w=m}else if(h>m){w*=m/h;h=m}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.84))};im.src=rd.result};rd.readAsDataURL(f)}
function edit(r,after){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h2>Edit Brew</h2><div class="preview">${img(r)}</div><p><input id="ename" style="width:100%" value="${r.name}"></p><div class="tools"><button class="btn alt" id="up">Upload image</button><input type="file" id="im" accept="image/*" hidden>${r.image?'<button class="btn red" id="rm">Remove image</button>':''}</div><p class="muted">Uploaded images are resized and embedded in exported JSON packs.</p><div class="tools"><button class="btn alt" id="cancel">Cancel</button><button class="btn" id="ok">Save</button></div></div>`;document.body.append(m);let ni=r.image;m.querySelector('#up').onclick=()=>m.querySelector('#im').click();m.querySelector('#im').onchange=e=>resize(e.target.files[0],d=>{ni=d;m.querySelector('.preview').innerHTML=`<img src="${d}">`});if(m.querySelector('#rm'))m.querySelector('#rm').onclick=()=>{ni=null;m.querySelector('.preview').innerHTML=ico(r.color)};m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('#ok').onclick=()=>{r.name=m.querySelector('#ename').value||r.name;r.image=ni;save();m.remove();after();}}
function pack(){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h2>Export Recipe Pack</h2><p>Images are embedded in the JSON.</p><div class="grid"><label class="choice"><input type="radio" name="scope" value="all" checked>All recipes</label><label class="choice"><input type="radio" name="scope" value="fav">Favourites</label><label class="choice"><input type="radio" name="scope" value="mine">My BrewGenge brews</label></div><p><input id="pn" style="width:100%" value="BrewGenge Recipe Pack"></p><div class="tools"><button class="btn alt" id="cancel">Cancel</button><button class="btn" id="go">Export</button></div></div>`;document.body.append(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('#go').onclick=()=>{let sc=m.querySelector('input[name=scope]:checked').value,a=S.recipes;if(sc==='fav')a=a.filter(r=>S.favs.includes(r.id));if(sc==='mine')a=a.filter(r=>r.custom);let data={format:'brewgenge-recipe-pack',version:1,name:m.querySelector('#pn').value,exportedAt:new Date().toISOString(),includesEmbeddedImages:true,recipes:a};dl(data,(data.name||'BrewGenge_Pack').replace(/[^a-z0-9]+/gi,'_')+'.json');m.remove()}}
function dl(o,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click()}function imp(e){let rd=new FileReader;rd.onload=()=>{try{let o=JSON.parse(rd.result),a=o.format==='brewgenge-recipe-pack'?o.recipes:Array.isArray(o)?o:[o];a.forEach(r=>{let c=JSON.parse(JSON.stringify(r));c.id='b'+Date.now()+Math.random();c.custom=true;if(!/^BrewGenge\b/i.test(c.name))c.name='BrewGenge '+c.name;S.recipes.push(c)});save();alert('Imported '+a.length+' recipe(s), including images.');library()}catch{alert('Invalid BrewGenge JSON')}};rd.readAsText(e.target.files[0])}
function create(){document.querySelector('#app').innerHTML=`<div class="card"><h2>Create Brew</h2><p><input id="n" style="width:100%" placeholder="BrewGenge Newy Lager"></p><p><input id="s" style="width:100%" value="Australian Lager"></p><button class="btn" id="make">Create and add image</button></div>`;document.querySelector('#make').onclick=()=>{let n=document.querySelector('#n').value||'Original';if(!/^BrewGenge\b/i.test(n))n='BrewGenge '+n;let r={id:'b'+Date.now(),name:n,style:document.querySelector('#s').value,abv:5,ibu:25,batch:40,desc:'BrewGenge original',custom:true,image:null,color:'#bd5b08'};S.recipes.push(r);save();edit(r,()=>{page='Recipe Library';render()})}}
function readme(){document.querySelector('#app').innerHTML=`<div class="card"><h2>Sharing with mates</h2><p>Recipe Library → Export Recipe Pack. Choose all recipes, favourites, or your BrewGenge originals. Any uploaded image is stored as Base64 inside the JSON file and imports with the recipe.</p><div class="note"><b>No additional SQL required.</b> The pack works entirely in the browser. The future Community option will require a new Supabase migration for public/shared recipe records and storage policies.</div></div>`}render();
</script></body></html>
