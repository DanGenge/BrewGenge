<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171412">
<title>BrewGenge | Recipe Library</title>
<style>
:root{--dark:#171412;--dark2:#241d18;--gold:#c97818;--gold2:#f1b84b;--paper:#f5f1e9;--card:#fff;--ink:#211d19;--muted:#756d65;--line:#e3dbd0;--danger:#a82820}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;border-bottom:3px solid var(--gold);padding:14px 18px}.brand{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand h1{margin:0;color:var(--gold2);font-family:Georgia,serif;font-size:28px}.brand small{color:#d8cec4}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--gold);color:#17120d}.btn.secondary{background:#fff;color:#33291f}.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}.btn.danger{background:var(--danger);color:#fff}.wrap{max-width:1180px;margin:auto;padding:22px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.search{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(40,26,12,.07);transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(40,26,12,.12)}.label{aspect-ratio:3/4;background:linear-gradient(145deg,#171412,#3a2717);display:grid;place-items:center;overflow:hidden}.label img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:var(--gold2);padding:20px}.placeholder b{display:block;font:700 26px Georgia,serif}.cardbody{padding:14px}.card h2{font-size:19px;margin:0 0 4px}.style{color:var(--muted);font-size:14px}.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.pill{background:#f4eadb;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.empty{text-align:center;padding:55px 20px;color:var(--muted);grid-column:1/-1}.overlay{position:fixed;inset:0;background:rgba(12,9,7,.72);z-index:50;display:none;align-items:stretch;justify-content:center}.overlay.open{display:flex}.detail{background:var(--paper);width:min(760px,100%);height:100%;overflow:auto;position:relative}.detailhead{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;padding:10px;background:rgba(23,20,18,.96);color:#fff}.hero{max-height:72vh;display:grid;place-items:center;background:#171412}.hero img{display:block;max-width:100%;max-height:72vh;object-fit:contain}.hero .placeholder{min-height:360px;display:grid;place-items:center}.content{padding:22px}.content h2{font:700 32px Georgia,serif;margin:0 0 5px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.metric b{display:block;font-size:18px;color:#9b5111}.section{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.section summary{padding:15px 17px;font-weight:800;cursor:pointer}.sectionbody{padding:0 17px 16px}.row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-top:1px solid #eee5dc}.muted{color:var(--muted)}.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171412;color:#fff;padding:11px 16px;border-radius:9px;display:none;z-index:99}@media(max-width:620px){.brand{align-items:flex-start}.brand small{display:none}.wrap{padding:14px}.quick{grid-template-columns:repeat(2,1fr)}.content{padding:16px}.card{border-radius:14px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div><h1>BrewGenge</h1><small>Guten 50L Recipe Library</small></div><div class="actions"><button class="btn secondary" id="importBtn">Import JSON</button><button class="btn" id="addBtn">Add Recipe</button></div></div></header>
<main class="wrap"><div class="toolbar"><input id="search" class="search" placeholder="Search beer, style or ingredient"><input id="fileInput" type="file" accept="application/json,.json" hidden></div><div id="grid" class="grid"></div></main>
<div id="overlay" class="overlay" aria-hidden="true"><article class="detail"><div class="detailhead"><button class="btn ghost" id="closeBtn">Close</button><div><button class="btn secondary" id="shareBtn">Share Recipe</button> <button class="btn danger" id="deleteBtn">Delete</button></div></div><div id="detailBody"></div></article></div>
<div id="notice" class="notice"></div>
<script>
const KEY='brewgenge_recipes_v3';
const seed=[{id:'coal-coast-cream-ale',name:'Coal & Coast Cream Ale',brand:'BrewGenge',style:'Premium Cream Ale',description:'A clean, crisp and refreshing Australian cream ale inspired by the Hunter coalfields and Newcastle coast.',batchSizeL:40,boilSizeL:47,boilTimeMin:60,equipmentProfile:'Guten 50L',labelImage:'img/coal-and-coast-cream-ale.png',targets:{og:1.048,fg:1.008,abvPercent:5.2,ibu:18,ebc:5},fermentables:[{name:'Joe White Pilsner Malt',amountKg:5.7,percentage:72},{name:'Flaked Maize',amountKg:1.6,percentage:20},{name:'Light Wheat Malt',amountKg:.6,percentage:8}],hops:[{name:'Pride of Ringwood',amountG:25,timeMin:60},{name:'Saaz',amountG:20,timeMin:10}],yeast:[{name:'SafAle US-05',manufacturer:'Fermentis',form:'Dry',amount:2,unit:'packets',packetSizeG:11.5,totalWeightG:23,notes:'Pitch two fresh sachets at 18 C.'}],mashSteps:[{name:'Saccharification',temperatureC:65,durationMin:60},{name:'Mash out',temperatureC:75,durationMin:10}],fermentationSteps:[{name:'Primary',temperatureC:18,durationDays:10},{name:'Cold crash',temperatureC:2,durationDays:3}],notes:['Fast turnaround cream ale designed for clean lager-like drinkability.']}];
let recipes=load(), current=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:seed}catch{return seed}}
function save(){localStorage.setItem(KEY,JSON.stringify(recipes))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function target(r,k){return r.targets?.[k]??r[k]??''}
function image(r,large=false){const src=r.labelImage||r.image||'';return src?`<img src="${esc(src)}" alt="${esc(r.name)} beer label" onerror="this.parentElement.innerHTML='<div class=placeholder><b>${esc(r.name)}</b><span>Beer label image not found</span></div>'">`:`<div class="placeholder"><b>${esc(r.name)}</b><span>${esc(r.style||'BrewGenge Recipe')}</span></div>`}
function render(){const q=document.querySelector('#search').value.toLowerCase();const list=recipes.filter(r=>JSON.stringify(r).toLowerCase().includes(q));grid.innerHTML=list.length?list.map(r=>`<article class="card" tabindex="0" data-id="${esc(r.id)}"><div class="label">${image(r)}</div><div class="cardbody"><h2>${esc(r.name)}</h2><div class="style">${esc(r.style||'')}</div><div class="stats"><span class="pill">${target(r,'abvPercent')||'?'}% ABV</span><span class="pill">${target(r,'ibu')||'?'} IBU</span><span class="pill">${r.batchSizeL||'?'} L</span></div></div></article>`).join(''):'<div class="empty">No matching recipes.</div>';document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>openRecipe(c.dataset.id);c.onkeydown=e=>{if(e.key==='Enter')openRecipe(c.dataset.id)}})}
function listRows(items,kind){if(!items?.length)return '<div class="muted">Not specified</div>';return items.map(x=>{let right='';if(kind==='grain')right=x.amountKg!=null?`${x.amountKg} kg${x.percentage!=null?' · '+x.percentage+'%':''}`:'';if(kind==='hop')right=`${x.amountG??''} g · ${x.timeMin??0} min`;if(kind==='yeast')right=`${x.amount??''} ${x.unit||'packets'}${x.packetSizeG?' · '+x.packetSizeG+' g each':''}`;if(kind==='step')right=`${x.temperatureC??''} C · ${x.durationMin??x.durationDays??''} ${x.durationDays!=null?'days':'min'}`;return `<div class="row"><span><b>${esc(x.name||'Step')}</b>${x.manufacturer?'<br><small class=muted>'+esc(x.manufacturer)+'</small>':''}</span><span>${esc(right)}</span></div>`}).join('')}
function openRecipe(id){current=recipes.find(r=>r.id===id);if(!current)return;detailBody.innerHTML=`<div class="hero">${image(current,true)}</div><div class="content"><h2>${esc(current.name)}</h2><div class="style">${esc(current.style||'')}</div><p>${esc(current.description||'')}</p><div class="quick"><div class="metric"><b>${target(current,'abvPercent')||'?' }%</b>ABV</div><div class="metric"><b>${target(current,'ibu')||'?'}</b>IBU</div><div class="metric"><b>${target(current,'og')||'?'}</b>OG</div><div class="metric"><b>${target(current,'fg')||'?'}</b>FG</div><div class="metric"><b>${current.batchSizeL||'?' } L</b>Batch</div></div><details class="section" open><summary>Fermentables</summary><div class="sectionbody">${listRows(current.fermentables,'grain')}</div></details><details class="section" open><summary>Hops</summary><div class="sectionbody">${listRows(current.hops,'hop')}</div></details><details class="section" open><summary>Yeast</summary><div class="sectionbody">${listRows(current.yeast,'yeast')}</div></details><details class="section"><summary>Mash Schedule</summary><div class="sectionbody">${listRows(current.mashSteps,'step')}</div></details><details class="section"><summary>Fermentation</summary><div class="sectionbody">${listRows(current.fermentationSteps||Object.entries(current.fermentation||{}).map(([name,value])=>({name,value})),'step')}</div></details><details class="section"><summary>Notes</summary><div class="sectionbody">${(current.notes||current.brewDayNotes||[]).map(n=>`<p>${esc(n)}</p>`).join('')||'<span class=muted>No notes</span>'}</div></details><div class="sharebar"><button class="btn" onclick="shareRecipe()">Share Recipe</button><button class="btn secondary" onclick="exportRecipe()">Export JSON</button><button class="btn secondary" onclick="chooseLabel()">Choose Label Image</button><input id="labelPicker" type="file" accept="image/*" hidden></div></div>`;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}
function closeRecipe(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');current=null}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportRecipe(){if(!current)return;download(new Blob([JSON.stringify({format:'BrewGenge Recipe Pack',version:1,recipes:[current]},null,2)],{type:'application/json'}),(current.name||'recipe').replace(/[^a-z0-9]+/gi,'_')+'.json')}
async function shareRecipe(){if(!current)return;const file=new File([JSON.stringify({format:'BrewGenge Recipe Pack',version:1,recipes:[current]},null,2)],(current.name||'recipe').replace(/[^a-z0-9]+/gi,'_')+'.json',{type:'application/json'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({title:current.name,text:`${current.name} · ${target(current,'abvPercent')}% ABV · ${target(current,'ibu')} IBU`,files:[file]})}else if(navigator.share){await navigator.share({title:current.name,text:`${current.name} · ${target(current,'abvPercent')}% ABV · ${target(current,'ibu')} IBU`})}else{exportRecipe();toast('Recipe JSON exported for sharing')}}catch(e){if(e.name!=='AbortError')exportRecipe()}}
function chooseLabel(){const pick=document.querySelector('#labelPicker');pick.onchange=()=>{const f=pick.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{current.labelImage=rd.result;save();openRecipe(current.id);render();toast('Label image saved with recipe')};rd.readAsDataURL(f)};pick.click()}
function normalize(obj){let arr=Array.isArray(obj)?obj:(obj.recipes||[obj]);return arr.filter(Boolean).map((r,i)=>({...r,id:r.id||crypto.randomUUID?.()||Date.now()+'-'+i,name:r.name||'Imported Recipe',yeast:Array.isArray(r.yeast)?r.yeast:r.yeast?[r.yeast]:[]}))}
function importFiles(files){[...files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{try{const incoming=normalize(JSON.parse(rd.result));incoming.forEach(r=>{const i=recipes.findIndex(x=>x.id===r.id);i>=0?recipes[i]=r:recipes.unshift(r)});save();render();toast(`${incoming.length} recipe${incoming.length===1?'':'s'} imported`)}catch{toast('That JSON file could not be imported')}};rd.readAsText(f)})}
function addRecipe(){const name=prompt('Recipe name');if(!name)return;const r={id:crypto.randomUUID?.()||String(Date.now()),name,style:'New Recipe',batchSizeL:40,targets:{abvPercent:0,ibu:0,og:1,fg:1},fermentables:[],hops:[],yeast:[{name:'Yeast not selected',amount:1,unit:'packet',packetSizeG:0}],mashSteps:[],fermentationSteps:[],notes:[]};recipes.unshift(r);save();render();openRecipe(r.id)}
function toast(msg){notice.textContent=msg;notice.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>notice.style.display='none',2500)}
importBtn.onclick=()=>fileInput.click();fileInput.onchange=()=>importFiles(fileInput.files);addBtn.onclick=addRecipe;closeBtn.onclick=closeRecipe;shareBtn.onclick=shareRecipe;deleteBtn.onclick=()=>{if(current&&confirm(`Delete ${current.name}?`)){recipes=recipes.filter(r=>r.id!==current.id);save();closeRecipe();render()}};search.oninput=render;overlay.onclick=e=>{if(e.target===overlay)closeRecipe()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRecipe()});render();
</script>
</body>
</html>
